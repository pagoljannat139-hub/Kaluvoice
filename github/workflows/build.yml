name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # এটি দিলে GitHub-এর Actions ট্যাব থেকে manually "Run workflow" করা যাবে

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ১. রিপোজিটরি কোড চেকআউট করা
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ২. Java JDK 17 সেটআপ করা (Android Gradle Plugin 8+ এর জন্য আবশ্যক)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ৩. Android SDK ক্যাশ সেটআপ করা যাতে বিল্ড ফাস্ট হয়
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ৪. gradlew ফাইলে এক্সিকিউট পারমিশন দেওয়া
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ৫. Gradle দিয়ে Release APK বিল্ড করা (assembleRelease)
      - name: Build Release APK with Gradle
        run: ./gradlew assembleRelease

      # ৬. বিল্ড করা APK ফাইলটি GitHub Artifacts-এ আপলোড করা যাতে ডাউনলোড করা যায়
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-changer-release-apk
          path: app/build/outputs/apk/release/app-release.apk
